<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/> <!-- Purple -->
      <stop offset="100%" stop-color="#3B82F6"/> <!-- Blue -->
    </linearGradient>
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Outer Hexagon / Database Core boundary -->
  <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Inner Neural Nodes & Circuit Paths -->
  <!-- Top Node -->
  <circle cx="50" cy="30" r="6" fill="url(#accentGrad)" />
  <!-- Bottom Left Node -->
  <circle cx="35" cy="65" r="5" fill="url(#primaryGrad)" />
  <!-- Bottom Right Node -->
  <circle cx="65" cy="65" r="5" fill="url(#primaryGrad)" />
  
  <!-- Center Core -->
  <circle cx="50" cy="50" r="10" fill="url(#primaryGrad)" />

  <!-- Connections -->
  <line x1="50" y1="36" x2="50" y2="40" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
  <line x1="39" y1="62" x2="43" y2="57" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round" />
  <line x1="61" y1="62" x2="57" y2="57" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round" />
  
  <line x1="50" y1="15" x2="50" y2="24" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="22" y1="70" x2="30" y2="67" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="78" y1="70" x2="70" y2="67" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>